# ─────────────────────────────────────────────────────────────────────────────
#  Edit this file to make the pipeline yours. Nothing else needs to change.
# ─────────────────────────────────────────────────────────────────────────────

profile:
  # Your resume as plain text or Markdown. The demo resume is used until you replace it.
  # Want to keep your real resume private? Leave this file as the demo and add your
  # resume as a GitHub Actions secret called RESUME_TEXT instead (see README).
  resume_file: profile/resume.md
  # Skills you have that your resume doesn't spell out (names must match skills.yaml).
  extra_skills: []
  # Also list roles that look restricted to citizens / permanent residents?
  show_restricted: false

ai:
  # Optional. Only used if an ANTHROPIC_API_KEY secret is set; otherwise skipped.
  model: claude-haiku-5-5
  max_jobs_per_run: 10   # caps the cost of each daily run

filters:
  # A job is kept if its title contains one of these...
  title_keywords: [intern, internship, graduate, student, vacation, summer, placement, co-op,
                   casual, part-time, part time, junior, trainee, entry level, associate,
                   analyst, data, insights, reporting, business intelligence, " bi ", it support]
  # ...and none of these (regular expressions).
  title_exclude: [senior, '\bsr\b', '\blead\b', principal, manager, director, '\bstaff\b',
                  head of, architect, experienced, '\bii\b', '\biii\b', '\biv\b']
  # Your city or region (lowercase words that appear in the job's location).
  locations: [melbourne, victoria, " vic"]
  # Remote jobs only count if the location also mentions one of these.
  remote_regions: [australia, " au", anz, apac]

  # Work-rights hints read from the job description (regular expressions).
  # "open" is checked first; "restricted" only applies if no "open" phrase matched.
  open_to_visa_patterns:
    - 'international students?'
    - 'student visa'
    - 'all work ?rights'
    - 'visa holders? (are|is) (welcome|eligible|encouraged)'
    - 'temporary (work|graduate) visa'
    - '(open|available) to international'
  restricted_patterns:
    - 'australian citizen'
    - 'permanent resident'
    - 'citizenship'
    - '\bpr (holders?|status|is required|required)'
    - 'security clearance'
    - 'baseline clearance'
    - 'nv1'
    - 'must have (full|unrestricted) (australian )?work(ing)? rights'

  # Job type tags.
  summer_patterns: [summer, vacation, 'start(ing)? (asap|immediately)']
  part_time_patterns: ['part[- ]time', casual, 'working student', '[1-3] days (a|per) week',
                       '(1[0-9]|2[0-4]) hours (a|per) week']

# Companies to watch. Open any job on their careers page and copy the token from the URL:
#   job-boards.greenhouse.io/<token>  -> ats: greenhouse
#   jobs.lever.co/<token>             -> ats: lever
#   jobs.ashbyhq.com/<token>          -> ats: ashby
#   jobs.smartrecruiters.com/<token>  -> ats: smartrecruiters
# Companies on Workday or custom systems can't be read this way. A wrong token only logs a warning.
companies:
  - {name: IMC Trading,          ats: greenhouse, token: imc}
  - {name: impact.com,           ats: greenhouse, token: impact}
  - {name: Karbon,               ats: greenhouse, token: karbon}
  - {name: MYOB,                 ats: lever,      token: myob-2}
  - {name: Deputy,               ats: lever,      token: deputy}
  - {name: RecordPoint,          ats: lever,      token: recordpoint}
  - {name: Macquarie Technology, ats: lever,      token: macquarietechnologygroup}
  - {name: Pattern,              ats: lever,      token: pattern}
  - {name: Culture Kings,        ats: lever,      token: culturekings}
  - {name: Relevance AI,         ats: ashby,      token: relevanceai}
  - {name: Maincode,             ats: ashby,      token: maincode}
  - {name: Halter,               ats: ashby,      token: halter}
  - {name: Legora,               ats: ashby,      token: legora}
